server:
  port: 8000
  read_timeout: 2h
  write_timeout: 2h
  body_limit: 2048   # MB

rate_limit:
  requests_per_second: 100
  burst: 200
  expiration: 60

# Streaming path'ler (örn. SSE /run/.../stream) fasthttp yerine net/http reverse
# proxy üzerinden gider; aksi halde response chunk'ları bufferlanır.
streaming_paths:
  - /run/*/stream

routes:
  - prefix: /workspace
    upstream: http://librelane-backend:8001
  - prefix: /run
    upstream: http://librelane-backend:8001
  - prefix: /jobs
    upstream: http://librelane-backend:8001
  - prefix: /tools
    upstream: http://librelane-backend:8001
  - prefix: /ai
    upstream: http://librelane-backend:8001
